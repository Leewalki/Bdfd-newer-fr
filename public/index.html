<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDFD Prefix ändern</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #4CAF50;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        input[type="text"], input[type="submit"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .response {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Prefix für deinen BDFD Bot ändern</h1>
        <form id="prefixForm">
            <input type="text" id="userId" placeholder="Deine Benutzer-ID" required>
            <input type="text" id="newPrefix" placeholder="Neuer Prefix" required>
            <input type="submit" value="Prefix ändern">
        </form>

        <div class="response" id="responseMessage"></div>
    </div>

    <script>
        document.getElementById('prefixForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const userId = document.getElementById('userId').value;
            const newPrefix = document.getElementById('newPrefix').value;

            fetch('/api/setprefix', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ userId, prefix: newPrefix })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP-Fehler! Status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('responseMessage').innerText = `Prefix für Benutzer ${userId} wurde erfolgreich geändert!`;
            })
            .catch(error => {
                document.getElementById('responseMessage').innerText = `Fehler: ${error.message}`;
            });
        });
    </script>

</body>
</html>
